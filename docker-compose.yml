services:
  db:
    image: postgres:17
    container_name: movies-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5434:5432"
    volumes:
      - movies-api-db-data:/var/lib/postgresql/data

volumes:
  movies-api-db-data:
